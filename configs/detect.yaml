# 검출·추적 설정 (담당: 장범수)
model: yolo26s.pt        # 11.12 yolo11n.pt에서 변경 (docs/experiments.md 261112). 4.2 검증 프레임 비교 후 다시 고름
conf: 0.25               # 검출 시험용. 추적(tracking.track)에는 넘기지 않는다: ByteTrack이 0.1~0.25 박스로 가려진 트랙을 잇고, 새 트랙은 bytetrack.yaml의 new_track_thresh(0.25)부터 시작
imgsz: 1920              # 영상 원본 폭. 640에서는 먼 횡단보도 위 보행자가 거의 안 잡힘 (docs/experiments.md 261111)
tracker: bytetrack.yaml  # ultralytics 내장
nms_agnostic: true       # 겹친 박스를 클래스와 무관하게 합침(한 차에 car·truck 박스가 같이 붙는 것을 줄임). 파인튜닝 라벨 1,147장 기준 겹친 차량 박스 쌍 627→186, 정밀도 0.781→0.794, 버스 재현율 0.832→0.810 (docs/experiments.md 261120)
nms_iou: 0.5             # 위에서 합치는 겹침(IoU) 기준. 0.7(기본)·0.6·0.5를 같은 1,147장(평가 영상 아님)에서 재고 고름
driver_overlap_min: 0.5  # 오토바이 박스와 겹치는 비율이 이 값 이상인 person은 운전자로 보고 보행자에서 뺌 (기술서 1.1, 초기값)
ped_conf_min: 0.25       # 1단계 보행자 집계(features.build)에서 신뢰도가 이 값 미만인 박스는 없는 것으로 봄. 추적에는 안 씀(위 conf 주석). 오검출 최소화 (기술서 11.20)

# 트랙 후처리·속도 (기술서 1.1·1.2, 초기값)
min_track_s: 1.0         # 이보다 짧은 트랙은 지움
merge_gap_s: 2.0         # 끊긴 같은 종류 트랙을 이어 붙이는 최대 시간 간격
merge_dist_box: 1.0      # 이어 붙이는 최대 거리 = 앞 트랙 마지막 박스 폭 × 이 값 (픽셀, 기술서 11.1 좌표 기준. 이전 1.5 m)
merge_size_min: 0.5      # 이을 두 박스(앞 트랙 마지막·뒤 트랙 첫)의 폭 비·높이 비(작은 쪽 ÷ 큰 쪽) 중 큰 값이 이 값 미만이면 잇지 않음(크게 잘못 잡힌 박스가 다른 차와 이어지는 것을 막음). 아래 link 이어 보기에도 씀. 학습 영상(10.31) 분포로 정함, 값은 측정 전 고정 (기술서 11.1, docs/experiments.md 261123). 0이면 끔
merge_overlap_s: 0.5     # 앞 트랙이 끝나기 전 이 시간 안에 시작한 트랙도 이어 붙임 (시간이 겹쳐 ID가 바뀐 경우)
merge_overlap_iou: 0.5   # 겹친 프레임에서 두 박스 평균 IoU가 이 값 이상일 때만 (줄 선 다른 차·옆 사람을 잇지 않게)
merge_overlap_classes: [vehicle]  # 겹침 이어 붙이기를 쓰는 클래스(vehicle·motorcycle·pedestrian). 차량만: 영상 전체에서 실제 우회전 +1(9:03)·이벤트 오추출 0, 트랙 오병합 1/6은 이벤트 영향 없음 (docs/experiments.md 261111). pedestrian은 켤 때 peds_lost 영향을 따로 잰다
link_gap_s: 3.0          # 우회전 이벤트: 진입로에서 끊긴 트랙 뒤 이 시간 안에 시작해 출구에 들어간 트랙도 같은 차로 봄 (정지선 근처 검출 공백 2~3초). 0이면 끔
link_dist_box: 2.0       # 위 이어 보기의 최대 거리 = 끊긴 트랙 마지막 박스 폭 × 이 값 (픽셀). A 오류 분석(261112)을 보고 넣음, 값은 측정 전 고정 (docs/experiments.md)
dedup_gap_s: 2.0         # 중복 이벤트 제거: 진입 시각 차이가 이 안인 차량 이벤트끼리만 비교 (기술서 8, 이벤트 일치 규칙의 2초와 같음)
dedup_contain_min: 0.8   # 작은 박스가 큰 박스 안에 든 비율(겹친 넓이 ÷ 작은 박스 넓이). 261112 중복 4쌍의 중앙값 0.85~0.97을 보고 정함, 값은 1339·1450 측정 전 고정 (docs/experiments.md 261119)
dedup_frames_min: 0.8    # 두 트랙이 함께 있는 프레임 중 위 비율을 넘는 프레임의 비율이 이 값 이상이면 같은 차. 0이면 끔
speed_window_s: 0.5      # 미터 좌표 이동평균 창 (진입 속도 참고값, site에 실측값이 있을 때만)

# COCO 클래스 → 프로젝트 클래스 (여기 없는 클래스는 버림)
class_map:
  car: vehicle
  bus: vehicle
  truck: vehicle
  motorcycle: motorcycle
  person: pedestrian
  pedestrian: pedestrian # 미세조정 모델의 사람 클래스 이름 (COCO에는 없어 사전학습 모델에는 영향 없음)

# 미세조정 라벨 ID (11.17 5종으로 변경, docs/labeling_guide.md 3)
train_ids:
  car: 0
  motorcycle: 1
  pedestrian: 2
  bus: 3
  truck: 4
