# 검출·추적 설정 (담당: 장범수)
model: yolo11n.pt        # 비교 대상: yolo26s.pt
conf: 0.25               # 검출 시험용. 추적(tracking.track)에는 넘기지 않는다: ByteTrack이 0.1~0.25 박스로 가려진 트랙을 잇고, 새 트랙은 bytetrack.yaml의 new_track_thresh(0.25)부터 시작
imgsz: 1920              # 영상 원본 폭. 640에서는 먼 횡단보도 위 보행자가 거의 안 잡힘 (docs/experiments.md 261111)
tracker: bytetrack.yaml  # ultralytics 내장
driver_overlap_min: 0.5  # 오토바이 박스와 겹치는 비율이 이 값 이상인 person은 운전자로 보고 보행자에서 뺌 (기술서 1.1, 초기값)

# 트랙 후처리·속도 (기술서 1.1·1.2, 초기값)
min_track_s: 1.0         # 이보다 짧은 트랙은 지움
merge_gap_s: 2.0         # 끊긴 같은 종류 트랙을 이어 붙이는 최대 시간 간격
merge_dist_m: 1.5        # 이어 붙이는 최대 거리 (미터 좌표)
merge_overlap_s: 0.5     # 앞 트랙이 끝나기 전 이 시간 안에 시작한 트랙도 이어 붙임 (시간이 겹쳐 ID가 바뀐 경우)
merge_overlap_iou: 0.5   # 겹친 프레임에서 두 박스 평균 IoU가 이 값 이상일 때만 (줄 선 다른 차·옆 사람을 잇지 않게)
merge_overlap_classes: [vehicle]  # 겹침 이어 붙이기를 쓰는 클래스(vehicle·motorcycle·pedestrian). 차량만: 영상 전체에서 실제 우회전 +1(9:03)·이벤트 오추출 0, 트랙 오병합 1/6은 이벤트 영향 없음 (docs/experiments.md 261111). pedestrian은 켤 때 peds_lost 영향을 따로 잰다
link_gap_s: 3.0          # 우회전 이벤트: 진입로에서 끊긴 트랙 뒤 이 시간 안에 시작해 출구에 들어간 트랙도 같은 차로 봄 (정지선 근처 검출 공백 2~3초). 0이면 끔
link_dist_box: 2.0       # 위 이어 보기의 최대 거리 = 끊긴 트랙 마지막 박스 폭 × 이 값 (픽셀). A 오류 분석(261112)을 보고 넣음, 값은 측정 전 고정 (docs/experiments.md)
speed_window_s: 0.5      # 미터 좌표 이동평균 창 (속도 계산)

# COCO 클래스 → 프로젝트 클래스 (여기 없는 클래스는 버림)
class_map:
  car: vehicle
  bus: vehicle
  truck: vehicle
  motorcycle: motorcycle
  person: pedestrian

# 미세조정 라벨 ID
train_ids:
  vehicle: 0
  motorcycle: 1
  pedestrian: 2
