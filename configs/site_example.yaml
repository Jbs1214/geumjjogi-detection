# 교차로 설정 예시 (담당: 김민영)
# tracking.roi_tool 로 영상마다 1개씩 만든다. 값은 픽셀 좌표 [x, y]. camera_moved_s·right_turn_signal은 영상을 보고 사람이 적는다.
# 파일 이름은 영상 이름과 맞춘다: A_20261107_0800.mp4 -> site_A_20261107_0800.yaml
# 화각이 영상마다 다를 수 있어 정지선·신호등 ROI도 영상마다 지정한다. 화각이 같은 영상은 파일을 복사해서 쓴다.
# 교차로 이름은 아래 site 값으로 구분한다(judged CSV의 intersection).

site: A

# 출구 횡단보도: 우회전 판별과 미터 좌표(homography) 기준. 판정 결과에서는 이름 exit
crosswalk:
  corners_px: [[0, 0], [0, 0], [0, 0], [0, 0]]  # 좌상·우상·우하·좌하 순서 (미터 좌표 원점 = 좌상)
  width_m: 0.0      # 좌상→우상 변, 촬영일 현장 실측
  length_m: 0.0     # 좌상→좌하 변

# 출구 말고 우회전 경로가 지나는 횡단보도 (진입 쪽, 모퉁이 등). 이름: 줄무늬 전체의 바깥 테두리 다각형
# 화면에 다 담기지 않거나 가려진 횡단보도는 보이는 부분만 찍는다. 전혀 안 보이면 넣지 않는다.
other_crosswalks_px:
  near: [[0, 0], [0, 0], [0, 0], [0, 0]]

camera_moved_s: []          # 영상 안에서 카메라가 움직인 구간 [[시작초, 끝초], ...]. 이 구간의 이벤트는 두 판정 모두 exclude(camera_moved). 기술서 1.2

approach_roi_px: [[0, 0], [0, 0], [0, 0], [0, 0]]  # 우회전 진입로. 우회전 차로만 좁게. 이 ROI를 지난 트랙이 출구 횡단보도에 진입하면 우회전 (기술서 11.1)

# 2단계 (적색 신호 정지선). 우회전 전용 신호가 있는 교차로는 제외.
right_turn_signal: false                            # 우회전 전용 신호가 있으면 true → 2단계는 모두 exclude(rturn_signal)
stop_line_px: [[0, 0], [0, 0]]                      # 정지선 양 끝점. 정지선이 없으면 진입 쪽 횡단보도 앞 가장자리 두 점을 대신 찍는다(기술서 2.3)
signal_roi_px: [[0, 0], [0, 0], [0, 0], [0, 0]]     # 우회전 차량이 접근하는 방향의 차량 신호등(직진 신호, 원형 3색)만. 보행자 신호등은 지정하지 않는다

# 판정 기준 초기값 (docs/judgment_criteria.md, 기술서 0절, 시험 영상으로 조정)
# 보행자는 경로상 각 횡단보도에 진입하는 순간 그 횡단보도 전체를 본다. 정지 기준은 정지선 판정(2단계)에만 쓴다.
stop_speed_mps: 0.5
stop_min_duration_s: 1.0
stopline_zone_m: 3.0      # "정지선 직전" = 정지선 앞 이 거리 이내 (2단계, 기술서 11.1)
occluded_edge_m: 1.0      # 횡단보도 경계에서 이 거리보다 안쪽에서 끊긴 보행자 트랙 = 가림 의심 (1단계 exclude, 기술서 11.1)
signal_min_frames: 5      # 신호 색이 연속 몇 프레임 같을 때만 상태를 바꾸는가
