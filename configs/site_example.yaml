# 교차로 설정 예시 (담당: 김민영)
# tracking.roi_tool 로 site_A.yaml 등을 만든다. 값은 픽셀 좌표 [x, y].
# 파일 단위(교차로마다 / 촬영일마다)는 docs/open_questions.md 1번에서 정한다.

site: A

crosswalk:
  corners_px: [[0, 0], [0, 0], [0, 0], [0, 0]]  # 좌상·우상·우하·좌하 순서 (미터 좌표 원점 = 좌상)
  width_m: 0.0      # 좌상→우상 변, 촬영일 현장 실측
  length_m: 0.0     # 좌상→좌하 변

approach_roi_px: [[0, 0], [0, 0], [0, 0], [0, 0]]  # 우회전 진입로
exit_roi_px: [[0, 0], [0, 0], [0, 0], [0, 0]]      # 출구 (출구 횡단보도 쪽)

# 2단계 (적색 신호 정지선). 우회전 전용 신호가 있는 교차로는 제외.
stop_line_px: [[0, 0], [0, 0]]                      # 정지선 양 끝점. 정지선이 없으면 비워 두면 횡단보도 앞을 기준선으로 쓴다
signal_roi_px: [[0, 0], [0, 0], [0, 0], [0, 0]]     # 우회전 차량이 접근하는 방향의 차량 신호등(직진 신호, 원형 3색)만. 보행자 신호등은 지정하지 않는다

# 판정 기준 초기값 (docs/judgment_criteria.md, 기술서 0절, 시험 영상으로 조정)
# 보행자는 횡단보도 전체를 본다. 정지 기준은 보행자 판정의 참고값이고 정지선 판정(2단계)에서는 조건이다.
approach_length_m: 15.0   # 횡단보도 진입선 앞 접근 구간 길이
stop_speed_mps: 0.5
stop_min_duration_s: 1.0
signal_min_frames: 5      # 신호 색이 연속 몇 프레임 같을 때만 상태를 바꾸는가
