# 평가·집계·블러 설정 (담당: 육주영)
# 기술서 3.1·6·11.1의 초기값. 바꾸면 docs/experiments.md에 이유를 남긴다.
# match_window_s·min_n_reference는 정답 구간 평가 결과를 본 뒤에는 바꾸지 않는다(CLAUDE.md 평가 기준 원칙).
match_window_s: 2.0     # 정답 이벤트와 추출 이벤트의 t_enter_s 차이가 이 값 이내이고 cls가 같으면 같은 이벤트
min_n_reference: 30     # 판정 대상이 이 값 미만인 칸은 "참고용", 단속 우선 순위에서 뒤로 보냄
bootstrap_n: 1000        # F1 부트스트랩 95% 구간의 재표본 수 (기술서 6)

# 블러 (eval.clips, eval.overlay). 기술서 11.1 블러 방법의 초기값
blur_conf: 0.10          # 블러용 검출 기준. 판정용(detect.yaml conf 0.25)보다 낮게 잡아 놓치는 사람·차량을 줄임
blur_plate_frac: 0.4     # 차량·오토바이 박스에서 블러하는 아래쪽 비율 (번호판 위치)
blur_margin: 0.15       # 박스 각 변을 이 비율만큼 넓혀서 블러
blur_interp_max_s: 2.0   # 검출이 끊긴 구간을 앞뒤 박스로 보간하는 최대 길이 (트랙 이어 붙이기 merge_gap_s와 같게)
clip_pad_s: 2.0          # 위반 의심 클립에서 이벤트 구간(접근~진입) 앞뒤로 붙이는 시간 (eval.clips, 초기값)
blur_kernel_frac: 0.5   # 가우시안 커널 크기 = 박스 짧은 변 x 이 값(홀수로 올림). 알아볼 수 없을 만큼 강하게
